# Cloudflare Pages project config (ADR-0029, Stage 4 H3). Committed, so it must never hold a
# secret: TMDB_READ_TOKEN is an encrypted Pages secret in production and comes from `.dev.vars`
# (git-ignored) locally.
name = "deep-cuts"
pages_build_output_dir = "dist"
# Fixed so the runtime's behavior only changes when this date is moved on purpose.
compatibility_date = "2026-10-01"

# CANONICAL_HOST, the only address the API answers on (server/apiGuard.ts), is deliberately not
# here: it's a Pages secret (`wrangler pages secret put CANONICAL_HOST --project-name deep-cuts`), so
# this public repo never names the live site. Old deploys at <hash>.<project>.pages.dev, and
# <project>.pages.dev itself, get 421 from every /api/* route. Without it the API refuses everything
# (functions/api/_middleware.ts) and `npm run deploy` won't run. Local runs on localhost are always
# allowed; `npm run preview:cf` sets a stand-in host.

# The rate-limit Worker (workers/rate-limit/), called by the Functions before any other work.
[[services]]
binding = "RATE_LIMITER"
service = "deep-cuts-rate-limit"

# The error-log Worker (workers/error-log/, ADR-0058): keeps the API's error lines in Workers Logs,
# which Pages Functions can't use themselves. If it isn't deployed, logging still prints to the
# real-time tail and the API answers as normal.
[[services]]
binding = "ERROR_LOG"
service = "deep-cuts-error-log"

# The accounts database (ADR-0031, Stage 6): Cloudflare D1 (SQLite), Free plan. Schema changes are
# versioned SQL files in migrations/. Locally, `npm run db:migrate:local` creates it under
# .wrangler/ (git-ignored). The id below is the hosted database's, created with
# `wrangler d1 create deep-cuts` (docs repo: hosting/go-live-checklist.md). It is not a secret:
# using it needs the owner's Cloudflare login.
[[d1_databases]]
binding = "DB"
database_name = "deep-cuts"
database_id = "bffdf6b8-1516-4ccc-a641-5a8d2e6a829d"
migrations_dir = "migrations"
