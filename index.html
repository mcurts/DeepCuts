<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- App icons and manifest: generated by `npm run icons` (scripts/generate-icons.mjs). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Posters are plain <img> requests (no CORS), so the preconnect must be too: with
         `crossorigin` the browser opens a separate connection the images never use. -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <meta name="theme-color" content="#120d0a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The tagline is src/config/brand.ts's TAGLINE; keep the copies in step. The Landing page
         sets the same title once React loads; other pages set their own. -->
    <title>Deep Cuts · The B-sides of cinema</title>
    <meta
      name="description"
      content="The B-sides of cinema: a fast, one-thumb movie tracker for finding films you didn't know existed."
    />
    <!-- Link previews (Slack, iMessage, LinkedIn) read these when the site is shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Deep Cuts" />
    <meta property="og:title" content="Deep Cuts · The B-sides of cinema" />
    <meta
      property="og:description"
      content="A fast, one-thumb movie tracker for finding films you didn't know existed."
    />
    <!-- Not for search engines yet (owner, 2026-10-07); the X-Robots-Tag header says the same. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Applies a saved or linked (?theme=) theme before the first paint, so a returning visitor
         never sees the default flash first (ADR-0056). Generated by `npm run tokens`; a tiny
         same-origin script, so the CSP stays script-src 'self'. Comes after the theme-color meta,
         which it updates. -->
    <script src="/theme-boot.js"></script>
    <!-- Hides the pre-rendered landing page below wherever this visit will show another page
         (ADR-0057): any address but `/`, or a device that's signed in. Same reasons as above. -->
    <script src="/shell-boot.js"></script>
  </head>
  <body>
    <!-- React renders the whole app into #root (src/main.tsx). The production build first fills
         it with the signed-out landing page as HTML (scripts/prerender.mjs, ADR-0057), so a first
         visit paints before the JavaScript has loaded; the app's first render replaces it. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
